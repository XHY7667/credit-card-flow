spring.application.name=clearing-event-service
server.port=${SERVER_PORT:8081}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=clearing-event-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties[spring.json.use.type.headers]=false
spring.kafka.consumer.properties[spring.json.value.default.type]=com.hx.clearingeventservice.event.ClearingPostedEvent

clearing-event-service.kafka.topic.transaction-events=creditcardflow.transaction-events
clearing-event-service.kafka.consumer.enabled=${KAFKA_CONSUMER_ENABLED:true}

management.endpoints.web.exposure.include=health,info
