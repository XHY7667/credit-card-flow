name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  root-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: pom.xml
      - name: Make Maven wrapper executable
        run: chmod +x mvnw
      - name: Run root test suite
        run: ./mvnw --batch-mode clean test

  clearing-event-service-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: services/clearing-event-service/pom.xml
      - name: Make Maven wrapper executable
        run: chmod +x mvnw
      - name: Run clearing event service tests
        run: >-
          ./mvnw --batch-mode
          -f services/clearing-event-service/pom.xml
          clean test

  api-gateway-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: services/api-gateway/pom.xml
      - name: Make Maven wrapper executable
        run: chmod +x mvnw
      - name: Run API Gateway tests
        run: >-
          ./mvnw --batch-mode
          -f services/api-gateway/pom.xml
          clean test

  docker-builds:
    runs-on: ubuntu-latest
    needs:
      - root-tests
      - clearing-event-service-tests
      - api-gateway-tests
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Verify Docker
        run: docker version
      - name: Validate Compose configuration
        run: docker compose config
      - name: Build CreditCardFlow image
        run: docker build -t creditcardflow:ci .
      - name: Build clearing event service image
        run: >-
          docker build
          -t clearing-event-service:ci
          services/clearing-event-service
      - name: Build API Gateway image
        run: >-
          docker build
          -t api-gateway:ci
          services/api-gateway
      - name: Inspect built images
        run: docker image inspect creditcardflow:ci clearing-event-service:ci api-gateway:ci
