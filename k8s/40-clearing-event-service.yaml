apiVersion: apps/v1
kind: Deployment
metadata:
  name: clearing-event-service
  namespace: creditcardflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: clearing-event-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: clearing-event-service
    spec:
      containers:
        - name: clearing-event-service
          image: clearing-event-service:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8081
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: creditcardflow-config
                  key: KAFKA_BOOTSTRAP_SERVERS
            - name: KAFKA_CONSUMER_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: creditcardflow-config
                  key: CLEARING_KAFKA_CONSUMER_ENABLED
          startupProbe:
            httpGet: &clearingHealth
              path: /actuator/health
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: *clearingHealth
            periodSeconds: 5
          livenessProbe:
            httpGet: *clearingHealth
            periodSeconds: 10
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: clearing-event-service
  namespace: creditcardflow
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: clearing-event-service
  ports:
    - name: http
      port: 8081
      targetPort: http
