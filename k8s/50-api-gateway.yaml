apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: creditcardflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: api-gateway:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8082
          env:
            - name: CREDITCARDFLOW_SERVICE_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: creditcardflow-config
                  key: CREDITCARDFLOW_SERVICE_BASE_URL
          startupProbe:
            httpGet: &gatewayHealth
              path: /actuator/health
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: *gatewayHealth
            periodSeconds: 5
          livenessProbe:
            httpGet: *gatewayHealth
            periodSeconds: 10
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: creditcardflow
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: api-gateway
  ports:
    - name: http
      port: 8082
      targetPort: http
      nodePort: 30082
