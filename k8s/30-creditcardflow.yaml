apiVersion: apps/v1
kind: Deployment
metadata:
  name: creditcardflow
  namespace: creditcardflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: creditcardflow
  template:
    metadata:
      labels:
        app.kubernetes.io/name: creditcardflow
    spec:
      containers:
        - name: creditcardflow
          image: creditcardflow:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              valueFrom:
                configMapKeyRef:
                  name: creditcardflow-config
                  key: SPRING_PROFILES_ACTIVE
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                configMapKeyRef:
                  name: creditcardflow-config
                  key: SPRING_DATASOURCE_URL
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: creditcardflow-config
                  key: SPRING_DATASOURCE_USERNAME
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: creditcardflow-secrets
                  key: POSTGRES_PASSWORD
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: creditcardflow-config
                  key: KAFKA_BOOTSTRAP_SERVERS
            - name: KAFKA_PUBLISHING_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: creditcardflow-config
                  key: KAFKA_PUBLISHING_ENABLED
            - name: KAFKA_CONSUMER_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: creditcardflow-config
                  key: KAFKA_CONSUMER_ENABLED
          startupProbe:
            httpGet: &creditcardflowHealth
              path: /actuator/health
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: *creditcardflowHealth
            periodSeconds: 5
          livenessProbe:
            httpGet: *creditcardflowHealth
            periodSeconds: 10
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: creditcardflow
  namespace: creditcardflow
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: creditcardflow
  ports:
    - name: http
      port: 8080
      targetPort: http
