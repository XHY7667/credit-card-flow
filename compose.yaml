services:
  postgres:
    image: postgres:18.4-bookworm
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: creditcardflow
      POSTGRES_USER: creditcardflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-creditcardflow_dev}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U creditcardflow -d creditcardflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:4.2.1
    ports:
      - "9092:9092"
    environment:
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:19092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20

  creditcardflow:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/creditcardflow
      SPRING_DATASOURCE_USERNAME: creditcardflow
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-creditcardflow_dev}
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      KAFKA_PUBLISHING_ENABLED: "true"
      KAFKA_CONSUMER_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 5s
      timeout: 5s
      retries: 20

  clearing-event-service:
    build:
      context: services/clearing-event-service
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      KAFKA_CONSUMER_ENABLED: "true"
    depends_on:
      kafka:
        condition: service_healthy

  api-gateway:
    build:
      context: services/api-gateway
      dockerfile: Dockerfile
    ports:
      - "8082:8082"
    environment:
      CREDITCARDFLOW_SERVICE_BASE_URL: http://creditcardflow:8080
    depends_on:
      creditcardflow:
        condition: service_healthy

volumes:
  postgres-data:
